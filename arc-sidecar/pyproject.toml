[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feishu-classmate-arc-sidecar"
version = "0.1.0"
description = "HTTP sidecar that wraps AutoResearchClaw's 23-stage pipeline for the feishu-classmate OpenClaw plugin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

# AutoResearchClaw itself is intentionally NOT a dependency here. Install it
# separately (`pip install -e path/to/AutoResearchClaw`) and point ARC_COMMAND
# at its `researchclaw` CLI. The sidecar shells out to that CLI; in ARC_MOCK
# mode (default) ARC isn't needed at all.

[tool.hatch.build.targets.wheel]
only-include = ["server.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
